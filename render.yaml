services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: taskflow-worker
    runtime: docker
    plan: starter
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString

  - type: worker
    name: taskflow-beat
    runtime: docker
    plan: starter
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString

  - type: keyvalue
    name: taskflow-redis
    plan: starter
    ipAllowList: []

databases:
  - name: taskflow-db
    plan: basic-256mb
